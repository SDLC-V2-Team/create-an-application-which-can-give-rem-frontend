name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reminder_user
          POSTGRES_PASSWORD: reminder_pass
          POSTGRES_DB: reminder_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate dev --name init
        env:
          DATABASE_URL: postgresql://reminder_user:reminder_pass@localhost:5432/reminder_db
      - run: npm run build
      - run: npm test  # assumes test script is defined
        env:
          DATABASE_URL: postgresql://reminder_user:reminder_pass@localhost:5432/reminder_db
