version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reminder_user
      POSTGRES_PASSWORD: reminder_pass
      POSTGRES_DB: reminder_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  service:
    build: .
    ports:
      - "4000:4000"
    depends_on:
      - db
    env_file:
      - .env
volumes:
  pgdata:
